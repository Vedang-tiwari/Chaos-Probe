services:
  chaos-probe-db:
    image: postgres:16-alpine
    container_name: chaos-probe-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chaos_probe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaos_probe"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaos-network

  chaos-probe-redis:
    image: redis:7-alpine
    container_name: chaos-probe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chaos-network

  chaos-probe-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaos-probe-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgrespassword@chaos-probe-db:5432/chaos_probe
      - REDIS_URL=redis://chaos-probe-redis:6379/0
      - CELERY_BROKER_URL=redis://chaos-probe-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://chaos-probe-redis:6379/2
      - PROMETHEUS_METRICS_ENABLED=True
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      chaos-probe-db:
        condition: service_healthy
      chaos-probe-redis:
        condition: service_healthy
    networks:
      - chaos-network

  # Sample target microservice used for demonstrating and validating experiments
  sample-target-service:
    build:
      context: ./examples/sample_fastapi_service
      dockerfile: Dockerfile
    container_name: sample-target-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=sample-target-service
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - chaos-network

  # Prometheus for scraping metrics from Chaos Probe API and target services
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: chaos-probe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - chaos-network

  # Grafana dashboard visualizing live experiment runs and resilience health
  grafana:
    image: grafana/grafana:10.4.0
    container_name: chaos-probe-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - chaos-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  chaos-network:
    name: chaos-network
    driver: bridge
