global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "chaos-probe-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["chaos-probe-api:8000", "host.docker.internal:8000"]

  - job_name: "sample-target-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sample-target-service:8001", "host.docker.internal:8001"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
